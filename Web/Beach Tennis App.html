<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>40x40 Beach Tennis</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-auth.jsx"></script>
<script type="text/babel" src="screens-subscription.jsx"></script>
<script type="text/babel" src="screens-profile.jsx"></script>
<script type="text/babel" src="screens-arena.jsx"></script>
<script type="text/babel" src="screens-professor.jsx"></script>
<script type="text/babel" src="screens-aluno.jsx"></script>
<script type="text/babel" src="screens-profissional.jsx"></script>
<script type="text/babel" src="screens-atleta.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #e9ecef;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: white;
    box-shadow: 0 0 40px rgba(0,0,0,0.1);
  }
  @media (min-width: 481px) {
    #app {
      height: 95vh;
      border-radius: 20px;
      max-height: 900px;
    }
  }

  /* Estilos para telas de assinatura */
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: #50B6E8;
    text-align: center;
    margin: 16px 0;
    letter-spacing: 0.5px;
  }

  .subscription-plans {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 0 20px 20px;
  }

  .plan-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .btn-plan {
    background: #2874B2;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }

  .btn-plan:hover {
    background: #1e5a8f;
    transform: scale(1.02);
  }

  .btn-plan.selected {
    background: #1e5a8f;
    box-shadow: 0 4px 12px rgba(40, 116, 178, 0.3);
  }

  .plan-details {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 12px 16px;
  }

  .plan-label {
    font-size: 11px;
    font-weight: 700;
    color: #999;
    margin-bottom: 6px;
    letter-spacing: 0.3px;
  }

  .plan-description {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
  }

  .form-subscription {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 0 20px 20px;
  }

  .form-row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .avatar-upload {
    width: 80px;
    height: 80px;
    background: #50B6E8;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
    cursor: pointer;
  }

  .camera-badge {
    position: absolute;
    bottom: -4px;
    right: -4px;
    width: 24px;
    height: 24px;
    background: #50B6E8;
    border: 2px solid white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group.flex-1 {
    flex: 1;
  }

  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: #50B6E8;
  }

  .form-input {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus {
    border-color: #50B6E8;
  }

  .input-with-checkbox {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #999;
    cursor: pointer;
  }

  .form-divider {
    height: 1px;
    background: linear-gradient(to right, transparent, #ddd, transparent);
    margin: 8px 0;
  }

  .btn-primary {
    background: #50B6E8;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary:hover {
    background: #3da3d5;
    transform: scale(1.02);
  }

  .btn-primary.large {
    width: 100%;
    padding: 14px 24px;
    font-size: 15px;
  }

  .payment-tabs {
    display: flex;
    gap: 8px;
    padding: 0 20px;
    margin-bottom: 16px;
  }

  .payment-tab {
    flex: 1;
    background: #f5f5f5;
    border: 2px solid transparent;
    border-radius: 12px;
    padding: 12px;
    font-size: 11px;
    font-weight: 600;
    color: #999;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }

  .payment-tab:hover {
    background: #ebebeb;
  }

  .payment-tab.active {
    background: white;
    border-color: #50B6E8;
    color: #50B6E8;
  }

  .payment-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 0 20px 20px;
  }

  .input-with-icon {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-with-icon svg {
    position: absolute;
    left: 12px;
    pointer-events: none;
  }

  .input-with-icon .form-input {
    padding-left: 36px;
  }

  .help-icon {
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }

  .payment-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }

  .btn-secondary {
    flex: 1;
    background: #FFD54F;
    color: #333;
    border: none;
    border-radius: 20px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-secondary:hover {
    background: #ffc107;
  }

  .pix-form .pix-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .qrcode {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pix-code {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }

  .pix-code .form-input {
    flex: 1;
    font-size: 11px;
    color: #999;
  }

  .btn-copy {
    background: #50B6E8;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
  }

  .btn-copy:hover {
    background: #3da3d5;
  }

  .pix-installment {
    font-size: 13px;
    color: #666;
  }

  /* Nav guide */
  .nav-guide {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 10px 18px;
    color: white;
    font-size: 11px;
    text-align: center;
    letter-spacing: 0.3px;
    pointer-events: none;
    z-index: 1000;
  }
</style>
</head>
<body>

<div id="app"></div>

<div class="nav-guide">40×40 Beach Tennis · Clique nos botões para navegar entre telas</div>

<script type="text/babel">
const { useState, useCallback } = React;

function App() {
  const [screen, setScreen] = useState('login');
  const [history, setHistory] = useState([]);

  const navigate = useCallback((to) => {
    setHistory(h => [...h, screen]);
    setScreen(to);
    // Save to localStorage
    try { localStorage.setItem('bt_screen', to); } catch(e) {}
  }, [screen]);

  const goBack = useCallback(() => {
    if (history.length === 0) return;
    const prev = history[history.length - 1];
    setHistory(h => h.slice(0, -1));
    setScreen(prev);
  }, [history]);

  // Make navigate and goBack available globally
  React.useEffect(() => {
    window.navigateTo = navigate;
    window.navigateBack = goBack;
  }, [navigate, goBack]);

  // Restore last screen on load
  React.useEffect(() => {
    try {
      const saved = localStorage.getItem('bt_screen');
      if (saved && saved !== 'login') {
        // Don't restore — always start at login for clean demo
      }
    } catch(e) {}
  }, []);

  const props = { navigate, goBack };

  const screens = {
    // Auth
    'login':                          <LoginScreen {...props} />,

    // Subscription (NOVO FLUXO)
    'subscription-plan':              <SubscriptionPlanScreen {...props} />,
    'subscription-register-athlete':  <SubscriptionRegisterAthleteScreen {...props} />,
    'subscription-register-arena':    <SubscriptionRegisterArenaScreen {...props} />,
    'subscription-payment':           <SubscriptionPaymentScreen {...props} />,

    // Profile (mantido para compatibilidade - telas antigas)
    'profile-select':                 <ProfileSelectScreen {...props} />,
    'subscription':                   <SubscriptionScreen {...props} />,
    'register-atleta':                <RegisterAtletaScreen {...props} />,
    'register-arena':                 <RegisterArenaScreen {...props} />,
    'payment':                        <PaymentScreen {...props} />,

    // Arena
    'arena-home':                     <ArenaHomeScreen {...props} />,
    'arena-professores':              <ArenaProfessoresScreen {...props} />,
    'arena-alunos':                   <ArenaAlunosScreen {...props} />,

    // Professor
    'professor-home':                 <ProfessorHomeScreen {...props} />,
    'professor-arenas':               <ProfessorArenasScreen {...props} />,
    'professor-avaliacoes':           <ProfessorAvaliacoesScreen {...props} />,
    'professor-treinos':              <ProfessorTreinosScreen {...props} />,

    // Aluno
    'aluno-home':                     <AlunoHomeScreen {...props} />,
    'aluno-estatisticas':             <AlunoEstatisticasScreen {...props} />,
    'aluno-avaliacoes':               <AlunoAvaliacoesScreen {...props} />,
    'aluno-treinos':                  <AlunoTreinosScreen {...props} />,

    // Profissional Técnico
    'profissional-home':              <ProfissionalHomeScreen {...props} />,
    'profissional-atletas':           <ProfissionalAtletasScreen {...props} />,
    'profissional-jogos':             <ProfissionalJogosScreen {...props} />,

    // Atleta
    'atleta-home':                    <AtletaHomeScreen {...props} />,
    'atleta-jogos':                   <AtletaJogosScreen {...props} />,
    'atleta-stats':                   <AtletaStatsScreen {...props} />,
    'atleta-duplas':                  <AtletaDuplasScreen {...props} />,
    'atleta-dupla-stats':             <AtletaStatsScreen {...props} goBack={goBack} title="ESTATÍSTICAS COM BELTRANO" />,
    'atleta-amigos':                  <AmigosScreen {...props} />,

    // Jogo
    'jogo-modo':                      <JogoModoScreen {...props} />,
    'jogo-register-simples':          <JogoRegisterScreen {...props} duplas={false} />,
    'jogo-register-duplas':           <JogoRegisterScreen {...props} duplas={true} />,
    'jogo-placar':                    <JogoPlacarScreen {...props} />,
  };

  return (
    <div id="app-root" style={{ width:'100%', height:'100%', display:'flex', flexDirection:'column', overflow:'hidden' }}>
      {screens[screen] || screens['login']}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
